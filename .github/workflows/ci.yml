name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run linter (if available)
      run: npm run lint --if-present || echo "No lint script found"
    
    - name: Build frontend
      run: npm run build
    
    - name: Run tests (if available)
      run: npm test --if-present || echo "No test script found"
    
    - name: Check build artifacts
      run: ls -la dist/ || echo "No dist folder found"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Check for common security issues
      run: npm audit --audit-level=moderate || true
    
    - name: Check code formatting
      run: |
        echo "Running basic code quality checks..."
        npm run format:check --if-present || echo "No format check available"
